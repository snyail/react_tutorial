version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "80:80"

  ws:
    build: 
      context: .
      dockerfile: docker/webserver/Dockerfile
    ports:
      - "3001:3001"

