services:
  # prodではnginxを噛ませつつdevでは噛ませないようにbuildするときのターゲットは指定しないのが正解らしい
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  ws:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./websocketserver:/app
      - ws_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"


volumes:
  frontend_node_modules:
  ws_node_modules: